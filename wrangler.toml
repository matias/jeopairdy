name = "jeopairdy"
main = ".open-next/worker.js"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "jeopairdy"

[observability.logs]
enabled = true
invocation_logs = true
